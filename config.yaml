# The Eurasian Bridge - Configuration File
# ==========================================

# Application settings
app:
  title: "The Eurasian Bridge | BIST vs MOEX"
  icon: "🌉"
  layout: "wide"
  sidebar_state: "expanded"

# Cache settings
cache:
  ttl_seconds: 3600  # 1 hour
  max_entries: 50

# API settings
api:
  moex_iss:
    base_url: "https://iss.moex.com"
    timeout_seconds: 15
    max_retries: 3
    retry_delay_seconds: 1
  yfinance:
    min_data_points: 5

# Data settings
data:
  min_data_points: 5
  min_correlation_points: 10
  default_lookback_days: 365
  moex_delay_days: 2  # MOEX data typically has 1-2 day delay
  fallback_lookback_days: 30  # Days to look back if no data in requested range

# Sector pairs - centralized data management
# RU tickers are MOEX board symbols used by the ISS API
sectors:
  aviation:
    TR: "THYAO.IS"
    RU: "AFLT"
    icon: "✈️"
  energy:
    TR: "TUPRS.IS"
    RU: "LKOH"
    icon: "🛢️"
  banking:
    TR: "AKBNK.IS"
    RU: "SBER"
    icon: "🏦"
  retail:
    TR: "BIMAS.IS"
    RU: "MGNT"
    icon: "🛒"
  steel:
    TR: "EREGL.IS"
    RU: "NLMK"
    icon: "🏗️"

# Market Capitalization Fallbacks (Billions USD)
# Used if live API data is unavailable (especially for MOEX)
# Updated: Feb 2026
market_cap_metadata:
  as_of: "2026-02-01"
  accessed_on: "2026-04-25"
  unit: "USD billions"
  methodology: >
    Manual public-reference snapshot normalized to USD billions and rounded to one
    decimal place. Values are used only as dashboard context, not as live valuation
    data. Refresh this block before publishing updated numerical claims.
  source_urls:
    yahoo_finance_quotes: "https://finance.yahoo.com/"
    moex_iss_interface: "https://www.moex.com/a2920"
    moex_iss_endpoint_root: "https://iss.moex.com/"

market_caps:
  THYAO.IS: 14.5
  AFLT: 2.1
  TUPRS.IS: 6.8
  LKOH: 45.2
  AKBNK.IS: 5.9
  SBER: 72.4
  BIMAS.IS: 8.2
  MGNT: 6.5
  EREGL.IS: 4.1
  NLMK: 9.8

# Curated monthly CPI change snapshots used for real-return mode.
# Coverage intentionally stops at the latest shared published month.
# TR series: TCMB/TURKSTAT consumer price releases
# RU series: Rosstat CPI releases
inflation_adjustment:
  latest_shared_month: "2026-03"
  coverage_start_month: "2025-03"
  accessed_on: "2026-04-25"
  methodology: >
    Monthly CPI percentage changes are stored as official month-over-month rates
    and compounded into a local CPI index at runtime. Real-return mode uses only
    the latest shared month available for both countries and does not extrapolate
    missing future inflation.
  source_urls:
    TR:
      - "https://www.tcmb.gov.tr/wps/wcm/connect/EN/TCMB%20EN/Main%20Menu/Statistics/Inflation%20Data/Consumer%20Prices"
      - "https://www.tcmb.gov.tr/wps/wcm/connect/7d680381-0da0-4656-88a2-fa37657043d5/mpricemarch26.pdf?CACHEID=ROOTWORKSPACE-7d680381-0da0-4656-88a2-fa37657043d5-pS6ieK9&MOD=AJPERES"
    RU:
      - "https://rosstat.gov.ru/central-news/document/281267"
  monthly_change_pct:
    TR:
      "2025-03": 2.46
      "2025-04": 3.00
      "2025-05": 1.53
      "2025-06": 1.37
      "2025-07": 2.06
      "2025-08": 2.04
      "2025-09": 3.23
      "2025-10": 2.55
      "2025-11": 0.87
      "2025-12": 0.89
      "2026-01": 4.84
      "2026-02": 2.96
      "2026-03": 1.94
    RU:
      "2025-03": 0.65
      "2025-04": 0.90
      "2025-05": 0.43
      "2025-06": 0.20
      "2025-07": 0.57
      "2025-08": -0.40
      "2025-09": 0.34
      "2025-10": 0.50
      "2025-11": 0.42
      "2025-12": 0.32
      "2026-01": 1.62
      "2026-02": 0.73
      "2026-03": 0.60

# Color palette - Institutional Finance theme
colors:
  primary: "#722F37"       # Deep Burgundy
  secondary: "#5A6978"     # Slate Grey
  tr_line: "#C41E3A"       # Turkish Red
  ru_line: "#5A6978"       # Russian Grey/Blue
  background: "#FFFFFF"    # White
  card_bg: "#F8F9FA"       # Light Grey
  text_dark: "#1A1A1A"     # Near Black
  text_muted: "#6C757D"    # Muted Grey
  success: "#28A745"       # Green
  danger: "#DC3545"        # Red

